<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<title>Tagwerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#1A2233; --muted:#6A7487; --line:#E1E5EB;
  --chip:#EDF0F4; --accent:#2B7A57; --accent-soft:#E1F1E8; --on-accent:#FFFFFF;
  --warn:#A86E05; --warn-soft:#FBF2DC; --danger:#B03F35; --hi:#D0573F;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141D; --surface:#182030; --ink:#E5EAF2; --muted:#8E9AAE; --line:#2A3446;
    --chip:#222C3D; --accent:#5CC092; --accent-soft:#1D3A2E; --on-accent:#0F141D;
    --warn:#EBBB52; --warn-soft:#352B14; --danger:#E5826F; --hi:#EE8A6E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141D; --surface:#182030; --ink:#E5EAF2; --muted:#8E9AAE; --line:#2A3446;
  --chip:#222C3D; --accent:#5CC092; --accent-soft:#1D3A2E; --on-accent:#0F141D;
  --warn:#EBBB52; --warn-soft:#352B14; --danger:#E5826F; --hi:#EE8A6E; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 110px}

/* ---------- Kopf ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 0 8px}
.top-title{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;margin:0;letter-spacing:-.01em}
.top-sub{color:var(--muted);font-size:15px;margin-top:3px}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .track{stroke:var(--line)}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px}

/* ---------- Woche (Tagesansicht) ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 6px}
.wk{border:0;background:transparent;border-radius:var(--r-md);padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wk small{font-size:12px;color:var(--muted)}
.wk b{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1}
.wk .dots{height:6px;display:flex;gap:3px}
.wk .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.5}
.wk .dots i.all{background:var(--accent);opacity:1}
.wk.is-today b{color:var(--accent)}
.wk.is-sel{background:var(--surface);box-shadow:0 0 0 1.5px var(--ink)}
.week-nav{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.link-btn{border:0;background:none;padding:6px 2px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--ink)}
.day-title{font-family:var(--display);font-weight:600;font-size:20px;margin:24px 0 10px}

/* ---------- Listen ---------- */
.sec{margin-top:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-head h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0;line-height:1.2}
.sec-head .count{color:var(--muted);font-size:14px;white-space:nowrap}
.list{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 8px 11px 14px;border-top:1px solid var(--line)}
.list>.row:first-child,.list>.pblock:first-child{border-top:0}
.row.hi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--hi)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;flex:none;transition:background .18s,border-color .18s,transform .18s}
.check svg{width:16px;height:16px;stroke:var(--on-accent);stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s ease .05s}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on svg{stroke-dashoffset:0}
.check:active{transform:scale(.9)}
.row-main{min-width:0;border:0;background:none;text-align:left;padding:2px 0}
.row-title{overflow-wrap:anywhere}
.row-meta{font-size:14px;color:var(--muted);margin-top:1px}
.row-meta .warn{color:var(--warn);font-weight:700}
.row.done .row-title{color:var(--muted);text-decoration:line-through}
.more{width:36px;height:36px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.more:hover{background:var(--chip)}
.more svg{width:18px;height:18px}
.pblock{border-top:1px solid var(--line);padding-bottom:6px}
.phead{display:flex;align-items:center;gap:9px;padding:13px 14px 4px;font-size:14px;color:var(--muted)}
.phead b{color:var(--ink);font-size:15px}
.pdot{width:10px;height:10px;border-radius:3px;background:var(--pc);flex:none}
.pcount{margin-left:auto;white-space:nowrap}
.pblock .row{border-top:0;margin-left:18px;padding-left:12px;padding-top:8px;padding-bottom:8px;border-left:2px solid var(--pc)}
.pblock .row.hi::before{left:-2px;width:2px;top:0;bottom:0;border-radius:0}
details.done-wrap summary{cursor:pointer;color:var(--muted);font-size:15px;padding:6px 2px;list-style:none}
details.done-wrap summary::-webkit-details-marker{display:none}
details.done-wrap summary::before{content:"▸ ";display:inline-block;transition:transform .2s}
details.done-wrap[open] summary::before{transform:rotate(90deg)}
details.done-wrap .list{margin-top:8px}
.empty{text-align:center;padding:36px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);margin-top:22px}
.empty p{margin:0 0 16px;color:var(--muted)}
.empty p:last-child{margin-bottom:0}
.empty .big{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink);margin-bottom:6px}

/* ---------- Aufgaben & Projekte ---------- */
.lib-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 10px 12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;position:relative}
.list>.lib-row:first-child{border-top:0}
.lib-row.hi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--hi)}
.lib-row:hover{background:var(--chip)}
.lib-row .chev{color:var(--muted)}
.pblock .lib-row{border-top:0;margin-left:18px;width:calc(100% - 18px);border-left:2px solid var(--pc);padding-top:9px;padding-bottom:9px}
.pblock .lib-row.hi::before{left:-2px;width:2px;top:0;bottom:0;border-radius:0}
.pblock>.lib-row.phead-btn{margin-left:0;width:100%;border-left:0;padding-top:13px}
.add-in{display:block;margin-left:18px;padding:9px 12px;border:0;border-left:2px solid var(--pc);background:none;color:var(--accent);font-weight:700;font-size:15px;text-align:left;width:calc(100% - 18px)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.hi{background:color-mix(in srgb,var(--hi) 15%,transparent);color:var(--hi)}
.arrows{display:flex;gap:2px}
.arrows button{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0;display:grid;place-items:center}
.arrows button:disabled{opacity:.3;cursor:default}
.arrows svg{width:16px;height:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- Fußleiste ---------- */
.foot{position:fixed;left:0;right:0;bottom:0;padding:8px 18px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}
.foot-in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.foot-label{font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.burger{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 14px 7px 11px;font-size:15px;font-weight:700;flex:none}
.burger svg{width:18px;height:18px}
.navlist{display:flex;flex-direction:column}
.nav-item{display:flex;align-items:center;gap:14px;padding:13px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:17px;width:100%}
.navlist .nav-item:first-child{border-top:0}
.nav-item svg{width:21px;height:21px;color:var(--muted);flex:none}
.nav-item.on{font-weight:700}
.nav-item.on svg{color:var(--accent)}
.nav-group{margin-top:8px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px;margin-bottom:12px}

/* ---------- Buttons & Felder ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:11px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:block;margin:0 0 16px}
.field>span,.lbl{display:block;font-size:14px;font-weight:700;margin-bottom:6px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:11px 12px;font-size:17px}
.inp.sm{width:5.2em;text-align:center;display:inline-block;padding:9px 6px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
select.inp.inline{width:auto;display:inline-block}
.seg{display:flex;flex-wrap:wrap;background:var(--chip);border-radius:var(--r-md);padding:4px;gap:2px}
.seg button{flex:1 1 auto;border:0;background:none;padding:9px 8px;border-radius:10px;font-size:15px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.chips.days .chip{padding:8px 0;text-align:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 13px;font-size:15px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mgrid .chip{padding:8px 0;border-radius:10px;text-align:center}
.mgrid .chip.wide{grid-column:span 3}
.inline-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.yrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.box{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin:0 0 16px;background:var(--surface)}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch-row b{display:block}
.switch-row small{color:var(--muted);font-size:14px}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.radio{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.radio:first-of-type{border-top:0}
.radio input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.radio small{display:block;color:var(--muted);font-size:14px}
.preview{margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:15px;line-height:1.45}
.preview:empty{display:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:10px;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--ink)}

/* ---------- Bottom Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:6px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .22s ease}
.scrim.open .sheet{transform:none}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:var(--r-lg);max-height:88%;padding-bottom:24px}}
.sheet-head{position:sticky;top:-6px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 12px;z-index:1}
.sheet-head h2{font-family:var(--display);font-weight:600;font-size:23px;margin:0;line-height:1.2}
.sheet-actions{display:flex;gap:10px;justify-content:space-between;margin-top:22px}
.sheet-actions .grow{flex:1}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{text-align:left}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.quick .btn{padding:10px 6px;font-size:15px;text-align:center}
.quick .btn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
textarea.inp{min-height:130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;resize:vertical}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 14px 12px 18px;border-radius:var(--r-md);display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:4px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- Familie ---------- */
.list.warn{border-color:var(--warn)}
.notice{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.notice-btn{display:block;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);font-weight:700}
.choice{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.choice-btn{display:block;text-align:left;padding:18px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface)}
.choice-btn:hover{border-color:var(--ink)}
.choice-btn b{display:block;font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:4px}
.choice-btn span{color:var(--muted);font-size:15px}
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.err{color:var(--danger)}
.err:empty{display:none}
.inp.code{text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.code-big{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.12em;margin:2px 0 6px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.mem{display:flex;gap:12px;align-items:center}
.badge{margin-left:auto;background:var(--hi);color:#fff;border-radius:10px;font-size:12px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center;line-height:18px}
.badge[hidden]{display:none}
.burger .badge{margin-left:2px}
.nav-item span:first-of-type{flex:1}
.check.locked{border-style:dashed;opacity:.55;cursor:not-allowed}
.check.locked.on{opacity:.75;border-style:solid}
span.check{display:grid}
.prio-lbl{font-size:13px;color:var(--muted);margin:14px 2px 6px}
.prio-lbl:first-child{margin-top:0}
.h-ic{width:18px;height:18px;vertical-align:-3px;margin-right:7px;color:var(--muted)}
.btn .h-ic{margin-right:8px}
[hidden]{display:none!important}
.rt{padding:10px 0;border-top:1px solid var(--line)}
.box>.rt:first-child,.box>.note+.rt{border-top:0}
.is-off{opacity:.55}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<footer class="foot" id="foot" hidden>
  <div class="foot-in">
    <span class="foot-label" id="foot-label">Heute</span>
    <button class="burger" data-a="menu" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menü<span class="badge" id="foot-badge" hidden></span></button>
  </div>
</footer>

<div class="scrim" id="scrim" aria-hidden="true"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="toast-undo" hidden>Rückgängig</button></div>

<!--CONFIG--><script src="config.js"></script><!--/CONFIG-->
<script>
"use strict";
/* =====================================================================
   Datum-Helfer (intern: Tagesnummern seit 1970, UTC – keine Zeitzonen-Fallen)
   ===================================================================== */
const DAY = 864e5;
const WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const WDL = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const COLORS = ["#3B6FD8","#2E9C8A","#C2503D","#8A5CC9","#C98A12","#5E7A3A","#E06B1F","#B3478A","#1F4E8C","#3F9C35",
                "#17A2C6","#E0457B","#5B4FCF","#8B5A2B","#9CB82E","#7A2E3A","#5B6B7F","#D4B106","#E88D7A","#A08CD9"];

function todayNum(){ const n=new Date(); return Math.round(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/DAY); }
function parts(dn){ const d=new Date(dn*DAY); return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1, d:d.getUTCDate(), wd:(d.getUTCDay()+6)%7}; }
function dnOf(y,m,d){ return Math.round(Date.UTC(y,m-1,d)/DAY); }
function lastDayOf(y,m){ return new Date(Date.UTC(y,m,0)).getUTCDate(); }
function iso(dn){ const p=parts(dn); return p.y+"-"+String(p.m).padStart(2,"0")+"-"+String(p.d).padStart(2,"0"); }
function fromIso(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return (y&&m&&d)? dnOf(y,m,d) : null; }
function fmtShort(dn){ const p=parts(dn); return WD[p.wd]+", "+p.d+"."+p.m+"."; }
function fmtLong(dn){ const p=parts(dn); return p.d+". "+MON[p.m-1]+" "+p.y; }
function fmtRel(dn){ const T=todayNum(); if(dn===T) return "heute"; if(dn===T+1) return "morgen"; if(dn===T-1) return "gestern"; return fmtShort(dn); }
function dot(s){ return /\.$/.test(s)? s : s+"."; }
function joinDe(a){ if(a.length<2) return a[0]||""; return a.slice(0,-1).join(", ")+" und "+a[a.length-1]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* =====================================================================
   Zustand
   D = zusammengeführte Sicht aus persönlichen (scope "me") und Familien-Daten (scope "fam").
   Die Termin-Logik oben arbeitet nur auf D.
   ===================================================================== */
function newRec(type,start){
  const p=parts(start);
  return {type, start, end:null, every:1, weekdays:[p.wd], monthDays:[p.d], yearDates:[{m:p.m,d:p.d}]};
}
const emptyData=()=>({tasks:[], projects:[], log:{}});
let D = emptyData();
const S = {mode:null, phase:"loading", uid:null, fid:null, family:null, members:{}, requests:[], familyName:"", isAnon:true, email:null, error:null};
let B = null; // Backend (Demo oder Firebase)

const PRIO=[[1,"Hoch"],[2,"Mittel"],[3,"Niedrig"]];
const RIGHTS=[["check","Abhaken & verschieben","Familien-Aufgaben erledigen, die ihr oder niemandem zugewiesen sind."],
              ["edit","Anlegen & bearbeiten","Familien-Projekte und -Aufgaben erstellen, ändern und löschen."],
              ["assign","Zuweisen","Aufgaben einer Person geben, die abhaken darf."],
              ["admin","Admin","Mitglieder aufnehmen, Rechte vergeben, mit Admin-Passwort persönliche Aufgaben einsehen."]];

function normalize(){
  let i=0;
  for(const x of [...D.projects, ...D.tasks]){
    if(![1,2,3].includes(x.prio)) x.prio=2;
    if(typeof x.order!=="number") x.order=i;
    if(x.scope!=="fam") x.scope="me";
    if(x.scope==="fam" && x.assignee===undefined && x.title!==undefined) x.assignee=null;
    i++;
  }
}
const byPrio=(a,b)=>(a.prio-b.prio)||(a.order-b.order);
function container(item){
  const sc=item.scope||"me";
  return item.projectId ? D.tasks.filter(t=>t.projectId===item.projectId)
                        : [...D.projects, ...D.tasks.filter(t=>!t.projectId)].filter(x=>x.scope===sc);
}
function nextOrder(item){ return container(item).reduce((m,x)=>Math.max(m,x.order|0),-1)+1; }
function neighbours(item){
  const list=container(item).sort(byPrio), i=list.indexOf(item);
  return {up: i>0 && list[i-1].prio===item.prio, down: i<list.length-1 && list[i+1].prio===item.prio};
}

/* ---------- Rechte ---------- */
function meM(){ return S.members[S.uid]||null; }
function R(){ const r=(meM()&&meM().rights)||{}, a=!!r.admin; return {admin:a, check:a||!!r.check, edit:a||!!r.edit, assign:a||!!r.assign}; }
function rightsOf(m){ const r=(m&&m.rights)||{}, a=!!r.admin; return {admin:a, check:a||!!r.check, edit:a||!!r.edit, assign:a||!!r.assign}; }
/* Mitglieder können für Familien-Aufgaben inaktiv sein (Feld active:false).
   Aufgaben, die einer inaktiven Person zugewiesen sind, stehen solange allen offen. */
function memberActive(uid){ const m=S.members[uid]; return !m || m.active!==false; }
function effAssignee(t){ return (t.assignee && !memberActive(t.assignee)) ? null : (t.assignee??null); }
function assigneeText(t){
  if(!t.assignee) return "für alle";
  if(memberActive(t.assignee)) return "für "+esc(nameOfNom(t.assignee));
  return "für alle, solange "+(t.assignee===S.uid?"du inaktiv bist":esc(nameOfNom(t.assignee))+" inaktiv ist");
}
function canAct(t){ if(t.scope!=="fam") return true; const r=R(); return r.check && (effAssignee(t)==null || t.assignee===S.uid || r.admin); }
function canEditItem(x){ return x.scope!=="fam" || R().edit; }
function assignable(keep){ return Object.entries(S.members).filter(([u,m])=>rightsOf(m).check && (m.active!==false || u===keep)).map(([uid,m])=>({uid,name:m.name+(m.active===false?" (inaktiv)":""),color:m.color})).sort((a,b)=>a.name.localeCompare(b.name)); }
function nameOf(uid){ if(uid===S.uid) return "dir"; return (S.members[uid]&&S.members[uid].name)||"ehemaligem Mitglied"; }
function nameOfNom(uid){ if(uid===S.uid) return "dich"; return (S.members[uid]&&S.members[uid].name)||"ehemaliges Mitglied"; }
function rightsSummary(m){ const r=rightsOf(m); if(r.admin) return "Admin"; const a=[]; if(r.edit) a.push("plant"); if(r.assign) a.push("weist zu"); if(r.check) a.push("hakt ab"); return a.length? joinDe(a).replace(/^./,c=>c.toUpperCase()) : "Nur ansehen"; }
const inToday = t => t.scope!=="fam" || (R().check && memberActive(S.uid) && (effAssignee(t)==null || t.assignee===S.uid));

/* ---------- Aufgaben & Projekte inaktiv schalten ----------
   inactive:true = ruht gerade. pauses = Zeiträume {from,to} (to=null: läuft noch),
   Termine in diesen Zeiträumen entfallen, auch nach dem Wieder-Einschalten. */
function pausedOn(x,dn){ return !!x && (x.pauses||[]).some(p=>dn>=p.from && (p.to==null || dn<=p.to)); }
function taskActive(t){ const p=t.projectId&&project(t.projectId); return !t.inactive && !(p&&p.inactive); }
function taskPaused(t,dn){ return pausedOn(t,dn) || (!!t.projectId && pausedOn(project(t.projectId),dn)); }
function setActive(x, active){
  const T=todayNum(), ps=(x.pauses||[]).filter(p=>p.to==null || p.to>=T-120), open=ps.find(p=>p.to==null);
  if(!active && !open) ps.push({from:T, to:null});
  if(active && open){ open.to=T-1; if(open.to<open.from) ps.splice(ps.indexOf(open),1); }
  if(active) delete x.inactive; else x.inactive=true;
  if(ps.length) x.pauses=ps; else delete x.pauses;
}
function activeBox(d, what){
  const p=d.projectId&&project(d.projectId);
  return `<div class="box"><div class="switch-row"><div><b>Aktiv</b><small>Ausgeschaltet ${what==="p"?"ruht das Projekt mit allen Aufgaben":"ruht die Aufgabe"}, zum Beispiel im Urlaub. Termine in dieser Zeit entfallen, nichts sammelt sich an.</small></div>
     <label class="switch"><input type="checkbox" data-bind="active" data-type="bool" data-rerender ${d.active?"checked":""} aria-label="Aktiv"><i></i></label></div>
     ${what==="t"&&p&&p.inactive?`<p class="note">Das Projekt „${esc(p.name)}“ ist gerade inaktiv, daher ruht diese Aufgabe ohnehin.</p>`:""}</div>`;
}
const isFam = t => t.scope==="fam";

/* ---------- Daten zusammenführen & zurückschreiben ---------- */
function subset(scope){
  const T=todayNum();
  const tasks=D.tasks.filter(t=>t.scope===scope), ids=new Set(tasks.map(t=>t.id)), log={};
  for(const k in D.log){
    if(!ids.has(k.split("|")[0])) continue;
    const o=+k.split("|")[1], L=D.log[k];
    if(scope==="me" && Math.max(o, L.m??o, L.d??o) < T-150) continue; // alte Einträge aufräumen
    log[k]=L;
  }
  return {tasks:clone(tasks), projects:clone(D.projects.filter(p=>p.scope===scope)), log:clone(log)};
}
function rebuild(priv, fam){
  D={ tasks:[...(priv.tasks||[]).map(t=>({...t,scope:"me"})), ...(fam.tasks||[]).map(t=>({...t,scope:"fam"}))],
      projects:[...(priv.projects||[]).map(p=>({...p,scope:"me"})), ...(fam.projects||[]).map(p=>({...p,scope:"fam"}))],
      log:{...(priv.log||{}), ...(fam.log||{})} };
  normalize();
}
function snapState(){
  const m=a=>new Map(a.map(x=>[x.id,JSON.stringify(x)]));
  return {t:m(D.tasks), p:m(D.projects), l:new Map(Object.entries(D.log).map(([k,v])=>[k,JSON.stringify(v)]))};
}
/* Vergleicht vorher/nachher und schreibt nur, was sich geändert hat:
   persönliche Daten als ein Dokument, Familien-Daten als einzelne Einträge. */
function commit(before){
  const ops=[]; let priv=false;
  const scopeOf=j=>JSON.parse(j).scope;
  const diff=(cur,prev,kind)=>{
    const seen=new Set();
    for(const x of cur){ seen.add(x.id); if(prev.get(x.id)!==JSON.stringify(x)){ if(x.scope==="fam") ops.push({op:"set",kind,id:x.id,data:clone(x)}); else priv=true; } }
    for(const [id,j] of prev) if(!seen.has(id)){ if(scopeOf(j)==="fam") ops.push({op:"del",kind,id}); else priv=true; }
  };
  diff(D.tasks,before.t,"task"); diff(D.projects,before.p,"project");
  const tScope=id=>{ const t=D.tasks.find(x=>x.id===id); if(t) return t.scope; const j=before.t.get(id); return j?scopeOf(j):"me"; };
  for(const k of new Set([...Object.keys(D.log), ...before.l.keys()])){
    const cur=D.log[k], j=cur?JSON.stringify(cur):undefined;
    if(j===before.l.get(k)) continue;
    if(tScope(k.split("|")[0])==="fam") ops.push({op:cur?"set":"del",kind:"log",id:k,data:cur?clone(cur):null}); else priv=true;
  }
  if(priv) B.savePrivate(subset("me"));
  if(ops.length) B.apply(ops).catch(err=>{ console.warn(err); toast("Das wurde nicht gespeichert: fehlende Berechtigung oder keine Verbindung."); });
}
let undoBefore=null;
function change(fn){ const before=snapState(); fn(); undoBefore=before; commit(before); }
function undo(){
  if(!undoBefore) return;
  const target=undoBefore, now=snapState();
  const back=m=>[...m.values()].map(j=>JSON.parse(j));
  D.tasks=back(target.t); D.projects=back(target.p); D.log=Object.fromEntries([...target.l].map(([k,j])=>[k,JSON.parse(j)]));
  undoBefore=null; commit(now); render(); hideToast();
}

/* ---------- Aktionen ---------- */
function logEntry(key){ return D.log[key] || (D.log[key]={}); }
function cleanEntry(key){ const L=D.log[key]; if(L && L.d==null && L.m==null && !L.s) delete D.log[key]; }
function findOcc(key){
  const [tid,o]=key.split("|"); const t=D.tasks.find(x=>x.id===tid); if(!t) return null;
  const orig=+o; return occurrences(t, orig-2, orig+2).find(x=>x.orig===orig) || null;
}
function moveOcc(o, target){
  const t=o.t, L=logEntry(o.key);
  if(t.follow==="shift" && target!==o.eff){ t.shifts=[...(t.shifts||[]), {after:o.orig, delta:target-o.eff}]; }
  if(target===o.base && t.follow!=="shift") delete L.m; else L.m=target;
  cleanEntry(o.key);
}
function denyMsg(t){
  if(t.scope==="fam" && !R().check) return "Du darfst Familien-Aufgaben nur ansehen.";
  if(t.scope==="fam") return "Diese Aufgabe ist "+nameOf(t.assignee)+" zugewiesen.";
  return "";
}
function toggleDone(o){
  if(!canAct(o.t)){ toast(denyMsg(o.t)); return; }
  const T=todayNum();
  change(()=>{
    if(o.done){ const L=logEntry(o.key); delete L.d; delete L.by; cleanEntry(o.key); return; }
    if(o.eff<T && o.t.movable) moveOcc(o,T);
    const L=logEntry(o.key); L.d=T; if(o.t.scope==="fam") L.by=S.uid;
  });
  render();
}
function replacedKeys(t){ const T=todayNum(); return new Set(occurrences(t,T-60,T+400).filter(o=>o.replaced).map(o=>o.key)); }
function doMove(key,target){
  const o=findOcc(key); if(!o) return;
  if(!canAct(o.t)){ toast(denyMsg(o.t)); return; }
  if(target==null || target===o.eff){ closeSheet(); return; }
  const before=replacedKeys(o.t);
  change(()=>moveOcc(o,target));
  const t=D.tasks.find(x=>x.id===o.t.id);
  const after=[...replacedKeys(t)].filter(k=>!before.has(k)).map(k=>+k.split("|")[1]).sort((a,b)=>a-b);
  let msg="Verschoben auf "+fmtRel(target); if(!msg.endsWith(".")) msg+=".";
  if(after.length) msg+=" Termin am "+joinDe(after.map(fmtShort))+(after.length>1?" entfallen.":" entfällt.");
  if(t.follow==="shift") msg+=" Folgetermine rücken mit.";
  closeSheet(); render(); toast(msg,true);
}
function doSkip(key){
  const o=findOcc(key); if(!o) return;
  if(!canAct(o.t)){ toast(denyMsg(o.t)); return; }
  change(()=>{ logEntry(key).s=1; }); closeSheet(); render(); toast("Termin ausgelassen.",true);
}
function doAssign(taskId, uid){
  const t=D.tasks.find(x=>x.id===taskId); if(!t||!R().assign) return;
  change(()=>{ t.assignee=uid||null; });
  closeSheet(); render(); toast(uid? "Zugewiesen an "+nameOfNom(uid).replace(/^dich$/,"dich")+"." : "Für alle freigegeben.", true);
}
function reorder(item,dir){
  if(!canEditItem(item)) return;
  change(()=>{
    const list=container(item).sort(byPrio); list.forEach((x,i)=>x.order=i);
    const i=list.indexOf(item), j=i+dir;
    if(j<0 || j>=list.length || list[j].prio!==item.prio) return;
    [list[i].order,list[j].order]=[list[j].order,list[i].order];
  });
  render();
}

/* =====================================================================
   Backend 1: Demo – alles nur auf diesem Gerät, mehrere Personen simulierbar
   ===================================================================== */
async function pinHash(fid,pin){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(fid+":"+pin));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function genCode(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
const MCOL=["#3B6FD8","#2E9C8A","#C2503D","#8A5CC9","#C98A12","#5E7A3A","#B3478A"];

function demoBackend(){
  const KEY="tagwerk.demo.v2";
  let st; try{ st=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!st) st={current:"u-"+uid(), fam:null, users:{}};
  const persist=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };
  const F=()=>st.fam;
  const sync=()=>{
    const f=F(); S.uid=st.current;
    const u=st.users[S.uid]||(f&&(f.members[S.uid]||f.requests[S.uid])?{fid:f.id,familyName:f.name}:{}); S.fid=u.fid||null; S.familyName=u.familyName||"";
    if(!f || S.fid!==f.id){ S.phase="welcome"; S.members={}; rebuild(emptyData(),emptyData()); return; }
    if(!f.members[S.uid]){ if(f.requests[S.uid]){ S.phase="waiting"; } else { S.phase="welcome"; } S.members={}; return; }
    S.phase="app"; S.family={name:f.name, code:f.code, createdBy:f.createdBy}; S.members=clone(f.members);
    S.requests=R().admin? Object.entries(f.requests).map(([uid,r])=>({uid,...r})) : [];
    rebuild(f.priv[S.uid]||emptyData(), {tasks:Object.values(f.tasks), projects:Object.values(f.projects), log:clone(f.log)});
  };
  const be={
    kind:"demo",
    async start(){ sync(); },
    savePrivate(data){ const f=F(); if(!f) return; f.priv[S.uid]=clone(data); persist(); },
    async apply(ops){
      const f=F();
      for(const o of ops){
        const coll=o.kind==="task"?f.tasks:o.kind==="project"?f.projects:f.log;
        if(o.op==="del") delete coll[o.id]; else coll[o.id]=clone(o.data);
      }
      persist();
    },
    async createFamily(name,myName,pin,importData){
      const id="f-"+uid();
      st.fam={id, name, code:genCode(), createdBy:st.current, pinHash:await pinHash(id,pin),
        members:{[st.current]:{name:myName,color:MCOL[0],rights:{admin:true,check:true,edit:true,assign:true},joinedAt:Date.now()}},
        requests:{}, tasks:{}, projects:{}, log:{}, priv:{}};
      if(importData) st.fam.priv[st.current]=importData;
      st.users[st.current]={fid:id, familyName:name}; persist(); sync();
    },
    async requestJoin(code,name){
      const f=F(); if(!f || f.code!==code.toUpperCase().replace(/[^A-Z0-9]/g,"")) throw new Error("code");
      f.requests[st.current]={name, at:Date.now()}; st.users[st.current]={fid:f.id, familyName:f.name}; persist(); sync();
    },
    async cancelRequest(){ const f=F(); if(f) delete f.requests[st.current]; delete st.users[st.current]; persist(); sync(); },
    async approve(uid,name,rights){ const f=F(); const n=Object.keys(f.members).length; f.members[uid]={name, color:MCOL[n%MCOL.length], rights, joinedAt:Date.now()}; delete f.requests[uid]; persist(); sync(); },
    async reject(uid){ delete F().requests[uid]; persist(); sync(); },
    async updateMember(uid,patch){ Object.assign(F().members[uid],clone(patch)); persist(); sync(); },
    async removeMember(uid){ const f=F(); delete f.members[uid]; delete f.priv[uid]; for(const t of Object.values(f.tasks)) if(t.assignee===uid) t.assignee=null; persist(); sync(); },
    async setPin(pin){ const f=F(); f.pinHash=await pinHash(f.id,pin); persist(); },
    async readPrivate(uid,pin){ const f=F(); if(await pinHash(f.id,pin)!==f.pinHash) throw new Error("pin"); return clone(f.priv[uid]||emptyData()); },
    async renameFamily(name){ F().name=name; persist(); sync(); },
    // nur Demo:
    people(){ const f=F(); if(!f) return []; return [...Object.entries(f.members).map(([uid,m])=>({uid,name:m.name,member:true})), ...Object.entries(f.requests).map(([uid,r])=>({uid,name:r.name+" (wartet)",member:false}))]; },
    switchTo(uid){ st.current=uid; persist(); sync(); },
    newDevice(){ st.current="u-"+uid(); persist(); sync(); },
    simulateRequest(){ const f=F(); const names=["Oma Erika","Lena","Max","Tante Bea"]; const nm=names[Object.keys(f.requests).length%names.length]; const id="u-"+uid(); f.requests[id]={name:nm, at:Date.now()}; st.users[id]={fid:f.id, familyName:f.name}; persist(); sync(); },
    reset(){ try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); },
  };
  return be;
}

/* =====================================================================
   Backend 2: Firebase – Anmeldung, gemeinsame Datenbank, Rechte auf dem Server
   ===================================================================== */
async function firebaseBackend(cfg){
  const base="https://www.gstatic.com/firebasejs/10.12.2/";
  const [A,AU,F]=await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
  const app=A.initializeApp(cfg), auth=AU.getAuth(app);
  let db; try{ db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }catch(e){ db=F.getFirestore(app); }
  const {doc,collection,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,query,where,Timestamp}=F;
  let unsubs=[], reqUnsub=null, fam=emptyData(), privRev=-1, privTimer=null, privPending=null;
  const stop=()=>{ unsubs.forEach(u=>u()); unsubs=[]; if(reqUnsub){reqUnsub();reqUnsub=null;} };
  const fd=(...p)=>doc(db,"families",S.fid,...p);
  const fc=(name)=>collection(db,"families",S.fid,name);
  const onErr=e=>console.warn("Firestore:",e.code||e);
  const refresh=()=>{ rebuild(subset("me"), fam); render(); };

  function watch(){
    stop(); S.phase="loading"; render();
    unsubs.push(onSnapshot(fd("members",S.uid), async s=>{
      if(s.exists()){
        const wasApp=S.phase==="app";
        S.members[S.uid]=s.data();
        if(!wasApp){ S.phase="app"; watchFamily(); }
        watchRequests(); render(); return;
      }
      if(S.phase==="app"){ stop(); S.phase="welcome"; S.fid=null; S.members={}; rebuild(emptyData(),emptyData()); try{ await deleteDoc(doc(db,"users",S.uid)); }catch(e){} render(); toast("Du bist nicht mehr Mitglied dieser Familie."); return; }
      try{ const r=await getDoc(fd("requests",S.uid)); S.phase=r.exists()?"waiting":"welcome"; }catch(e){ S.phase="welcome"; }
      render();
    }, e=>{ onErr(e); S.phase="welcome"; render(); }));
  }
  function watchRequests(){
    if(R().admin && !reqUnsub){
      reqUnsub=onSnapshot(fc("requests"), qs=>{ S.requests=qs.docs.map(d=>({uid:d.id,...d.data()})); render(); }, onErr);
    } else if(!R().admin && reqUnsub){ reqUnsub(); reqUnsub=null; S.requests=[]; }
  }
  function watchFamily(){
    fam=emptyData(); privRev=-1;
    unsubs.push(onSnapshot(doc(db,"families",S.fid), s=>{ S.family=s.data()||{}; render(); }, onErr));
    unsubs.push(onSnapshot(fc("members"), qs=>{ const m={}; qs.forEach(d=>m[d.id]=d.data()); S.members=m; watchRequests(); render(); }, onErr));
    unsubs.push(onSnapshot(fc("tasks"), qs=>{ fam.tasks=qs.docs.map(d=>d.data()); refresh(); }, onErr));
    unsubs.push(onSnapshot(fc("projects"), qs=>{ fam.projects=qs.docs.map(d=>d.data()); refresh(); }, onErr));
    unsubs.push(onSnapshot(query(fc("log"), where("orig",">=",todayNum()-200)), qs=>{
      const l={}; qs.forEach(d=>{ const x=d.data(), e={}; for(const f of ["d","m","s","by"]) if(x[f]!=null) e[f]=x[f]; l[x.taskId+"|"+x.orig]=e; });
      fam.log=l; refresh();
    }, onErr));
    unsubs.push(onSnapshot(fd("private",S.uid), s=>{
      if(s.metadata.hasPendingWrites) return;
      const p=s.exists()? s.data() : emptyData();
      if((p.rev||0)>privRev){ privRev=p.rev||0; rebuild(p, fam); render(); }
    }, onErr));
  }
  async function flushPrivate(){
    if(!privPending) return; const data=privPending; privPending=null;
    data.rev=Date.now(); privRev=data.rev;
    try{ await setDoc(fd("private",S.uid), data); }catch(e){ onErr(e); toast("Persönliche Aufgaben konnten nicht gespeichert werden."); }
  }

  const be={
    kind:"firebase",
    async start(){
      await new Promise((res,rej)=>{ const un=AU.onAuthStateChanged(auth,u=>{ if(u){ un(); S.uid=u.uid; S.isAnon=u.isAnonymous; S.email=u.email; res(); } else AU.signInAnonymously(auth).catch(e=>{ un(); rej(e); }); }); });
      const us=await getDoc(doc(db,"users",S.uid));
      S.fid=us.exists()? us.data().fid : null; S.familyName=us.exists()? (us.data().familyName||"") : "";
      if(S.fid) watch(); else S.phase="welcome";
    },
    savePrivate(data){ privPending=data; clearTimeout(privTimer); privTimer=setTimeout(flushPrivate,600); },
    async apply(ops){
      const b=writeBatch(db);
      for(const o of ops){
        const coll=o.kind==="task"?"tasks":o.kind==="project"?"projects":"log";
        const id=o.kind==="log"? o.id.replace("|","_") : o.id, ref=fd(coll,id);
        if(o.op==="del") b.delete(ref);
        else if(o.kind==="log"){ const [tid,orig]=o.id.split("|"); b.set(ref,{...o.data, taskId:tid, orig:+orig}); }
        else { const x=clone(o.data); x.scope="fam"; if(o.kind==="task" && x.assignee===undefined) x.assignee=null; b.set(ref,x); }
      }
      await b.commit();
    },
    async createFamily(name,myName,pin,importData){
      for(let attempt=0; attempt<3; attempt++){
        const fid=uid()+uid(), code=genCode(), b=writeBatch(db);
        b.set(doc(db,"families",fid),{name, code, createdBy:S.uid, createdAt:Date.now()});
        b.set(doc(db,"families",fid,"members",S.uid),{name:myName, color:MCOL[0], rights:{admin:true,check:true,edit:true,assign:true}, joinedAt:Date.now()});
        b.set(doc(db,"families",fid,"secret","admin"),{pinHash:await pinHash(fid,pin)});
        b.set(doc(db,"joinCodes",code),{fid, familyName:name, createdBy:S.uid});
        b.set(doc(db,"users",S.uid),{fid, familyName:name});
        if(importData) b.set(doc(db,"families",fid,"private",S.uid),{...importData, rev:Date.now()});
        try{ await b.commit(); S.fid=fid; S.familyName=name; watch(); return; }
        catch(e){ if(attempt===2) throw e; }  // Code schon vergeben -> neuer Versuch
      }
    },
    async requestJoin(code,name){
      code=code.toUpperCase().replace(/[^A-Z0-9]/g,"");
      const c=await getDoc(doc(db,"joinCodes",code)); if(!c.exists()) throw new Error("code");
      const fid=c.data().fid, b=writeBatch(db);
      b.set(doc(db,"families",fid,"requests",S.uid),{name, at:Date.now(), code});
      b.set(doc(db,"users",S.uid),{fid, familyName:c.data().familyName||""});
      await b.commit(); S.fid=fid; S.familyName=c.data().familyName||""; watch();
    },
    async cancelRequest(){ try{ await deleteDoc(fd("requests",S.uid)); }catch(e){} try{ await deleteDoc(doc(db,"users",S.uid)); }catch(e){} stop(); S.fid=null; S.phase="welcome"; render(); },
    async approve(uid,name,rights){
      const n=Object.keys(S.members).length, b=writeBatch(db);
      b.set(fd("members",uid),{name, color:MCOL[n%MCOL.length], rights, joinedAt:Date.now()});
      b.delete(fd("requests",uid)); await b.commit();
    },
    async reject(uid){ await deleteDoc(fd("requests",uid)); },
    async updateMember(uid,patch){ await updateDoc(fd("members",uid), patch); },
    async removeMember(uid){
      const b=writeBatch(db);
      for(const t of D.tasks) if(t.scope==="fam" && t.assignee===uid) b.update(fd("tasks",t.id),{assignee:null});
      b.delete(fd("members",uid)); await b.commit();
    },
    async setPin(pin){ await setDoc(fd("secret","admin"),{pinHash:await pinHash(S.fid,pin)}); },
    async readPrivate(uid,pin){
      try{ await setDoc(fd("unlocks",S.uid),{hash:await pinHash(S.fid,pin), until:Timestamp.fromMillis(Date.now()+15*60000)}); }
      catch(e){ throw new Error("pin"); }
      const s=await getDoc(fd("private",uid)); return s.exists()? s.data() : emptyData();
    },
    async renameFamily(name){ await updateDoc(doc(db,"families",S.fid),{name}); },
    async secure(email,pw){ const cred=AU.EmailAuthProvider.credential(email,pw); const r=await AU.linkWithCredential(auth.currentUser,cred); S.isAnon=false; S.email=r.user.email; },
    async signIn(email,pw){ await AU.signInWithEmailAndPassword(auth,email,pw); location.reload(); },
  };
  return be;
}

/* ---------- Zeilen ---------- */
function projProgress(pid, pOrig){
  let done=0,total=0;
  for(const t of D.tasks.filter(x=>x.projectId===pid)){
    const dn=pOrig+(t.offset|0), key=t.id+"|"+dn, L=D.log[key];
    if(L&&L.s) continue; if(taskPaused(t,dn) && !(L&&L.d!=null)) continue; total++; if(L&&L.d!=null) done++;
  }
  return {done,total};
}
function rowHtml(o, meta, opts={}){
  const m=[], t=o.t;
  if(meta) m.push(meta);
  if(o.moved && o.eff!==o.orig && !meta) m.push("verschoben von "+fmtShort(o.orig));
  if(t.scope==="fam"){
    if(o.done){ const L=D.log[o.key]||{}; if(L.by) m.push("erledigt von "+(L.by===S.uid?"dir":esc(nameOfNom(L.by)))); }
    else if(opts.showAssignee) m.push(assigneeText(t));
    else m.push(t.assignee===S.uid? "Familie, für dich" : "Familie");
  }
  if(o.done && o.doneOn!=null && o.doneOn!==o.eff) m.push(fmtRel(o.doneOn));
  const act=canAct(t);
  return `<div class="row${o.done?" done":""}${t.prio===1&&!o.done?" hi":""}">
    <button class="check${o.done?" on":""}${act?"":" locked"}" data-a="toggle" data-k="${o.key}" aria-pressed="${o.done}" ${act?"":'aria-disabled="true"'} aria-label="${esc(t.title)} ${o.done?"als offen markieren":"abhaken"}">${act||o.done?ICON.check:""}</button>
    <button class="row-main" data-a="occ" data-k="${o.key}">
      <div class="row-title">${esc(t.title)}</div>${m.length?`<div class="row-meta">${m.join(", ")}</div>`:""}
    </button>
    <button class="more" data-a="occ" data-k="${o.key}" aria-label="Details zu ${esc(t.title)}">${ICON.dots}</button>
  </div>`;
}
function overMeta(o){ return `<span class="warn">fällig seit ${fmtRel(o.eff)}</span>`; }
function blocksHtml(items, opts){
  // Projekte mit gleichem Namen (persönlich oder Familie) bilden einen gemeinsamen Block
  const blocks=new Map();
  for(const it of items){
    const t=it.o.t, pr=t.projectId && project(t.projectId);
    if(pr){
      const P=it.o.orig-(t.offset|0), k="p|"+pr.name.trim().toLocaleLowerCase("de");
      if(!blocks.has(k)) blocks.set(k,{refs:[],inst:new Map(),items:[]});
      const bl=blocks.get(k); if(!bl.refs.includes(pr)) bl.refs.push(pr); bl.inst.set(pr.id+"|"+P,{id:pr.id,P}); bl.items.push(it);
    }
    else blocks.set("t|"+it.o.key,{ref:t,P:it.o.eff,items:[it]});
  }
  for(const bl of blocks.values()) if(bl.refs){ bl.refs.sort(byPrio); bl.ref=bl.refs[0]; bl.P=Math.min(...[...bl.inst.values()].map(x=>x.P)); }
  // persönliche und Familien-Einträge gleicher Priorität: nach Reihenfolge, dann Datum
  const arr=[...blocks.values()].sort((a,b)=>(a.ref.prio-b.ref.prio)||(a.ref.scope===b.ref.scope?a.ref.order-b.ref.order:0)||(a.P-b.P));
  return arr.map(b=>{
    if(b.ref.name===undefined){ const it=b.items[0]; return rowHtml(it.o, it.over?overMeta(it.o):"", opts); }
    const pg={done:0,total:0}; for(const x of b.inst.values()){ const q=projProgress(x.id,x.P); pg.done+=q.done; pg.total+=q.total; }
    const rows=b.items.sort((x,y)=>byPrio(x.o.t,y.o.t)||(x.o.eff-y.o.eff)).map(it=>rowHtml(it.o, it.over?overMeta(it.o):"", opts)).join("");
    return `<div class="pblock" style="--pc:${b.ref.color}"><div class="phead"><span class="pdot"></span><b>${esc(b.ref.name)}</b>${b.refs.every(r=>r.scope==="fam")&&!(opts&&opts.showAssignee)?'<span class="tag">Familie</span>':""}<span class="pcount">${pg.done} von ${pg.total}</span></div>${rows}</div>`;
  }).join("");
}
function dayListHtml(day, filter, opts={}){
  const T=todayNum(), isToday=day===T;
  const {due,overdue,missed}=dayModel(day, filter);
  const open=[...overdue.map(o=>({o,over:true})), ...due.filter(o=>!o.done).map(o=>({o}))];
  const done=due.filter(o=>o.done);
  let h="";
  if(!D.tasks.length && !opts.showAssignee){
    return `<div class="empty"><div class="big">Noch keine Aufgaben</div><p>Leg die erste an, zum Beispiel „Pflanzen gießen“ jeden Dienstag.</p><button class="btn primary" data-a="newTask">Aufgabe anlegen</button></div>`;
  }
  if(open.length) h+=`<div class="list"${opts.tight?"":' style="margin-top:14px"'}>${blocksHtml(open,opts)}</div>`;
  else h+=`<div class="empty"${opts.tight?' style="margin-top:0"':""}><div class="big">${done.length?"Alles erledigt.":"Nichts geplant."}</div><p>${done.length?"Für "+(isToday?"heute":"diesen Tag")+" ist alles abgehakt.":"Für "+(isToday?"heute":"diesen Tag")+" steht keine Aufgabe an."}</p></div>`;
  if(done.length){
    h+=`<section class="sec"><details class="done-wrap"${open.length?"":" open"}><summary>Erledigt (${done.length})</summary><div class="list">${done.sort((a,b)=>byPrio(a.t,b.t)).map(o=>rowHtml(o, o.t.projectId&&project(o.t.projectId)&&o.t.scope!=="fam"?esc(project(o.t.projectId).name):"", opts)).join("")}</div></details></section>`;
  }
  if(missed.length){
    h+=`<section class="sec"><details class="done-wrap"><summary>Verpasst, nicht verschiebbar (${missed.length})</summary><div class="list">${missed.map(o=>rowHtml(o,"war am "+fmtShort(o.eff),opts)).join("")}</div></details></section>`;
  }
  return h;
}
function ringHtml(done,total){
  const Rr=22, C=2*Math.PI*Rr, f=total?done/total:0;
  return `<div class="ring" role="img" aria-label="${done} von ${total} erledigt"><svg viewBox="0 0 54 54"><circle class="track" cx="27" cy="27" r="${Rr}"/><circle class="val" cx="27" cy="27" r="${Rr}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-f)).toFixed(2)}"/></svg><span>${done}/${total}</span></div>`;
}

function renderToday(){
  const T=todayNum(), p=parts(T);
  const {due,overdue}=dayModel(T, inToday);
  const total=due.length+overdue.length, doneN=due.filter(o=>o.done).length, openN=total-doneN;
  const sub = !total ? "Heute steht nichts an" : openN===0 ? "Alles erledigt" : openN===1 ? "1 Aufgabe offen" : openN+" Aufgaben offen";
  let h=`<header class="top"><div><h1 class="top-title">${WDL[p.wd]}, ${p.d}. ${MON[p.m-1]}</h1><div class="top-sub">${sub}</div></div>${total?ringHtml(doneN,total):""}</header>`;
  if(S.requests.length) h+=`<button class="notice-btn" data-a="go" data-v="family">${S.requests.length===1?"1 Person möchte":S.requests.length+" Personen möchten"} der Familie beitreten</button>`;
  h+=dayListHtml(T, inToday);
  if(R().check && !memberActive(S.uid) && D.tasks.some(isFam)) h+=`<p class="note" style="text-align:center;margin-top:16px">Du bist für Familien-Aufgaben gerade inaktiv. Sie stehen unter <button class="link-btn" data-a="go" data-v="family">Familie</button>.</p>`;
  else if(!R().check && D.tasks.some(isFam)) h+=`<p class="note" style="text-align:center;margin-top:16px">Familien-Aufgaben siehst du unter <button class="link-btn" data-a="go" data-v="family">Familie</button>.</p>`;
  return h;
}
function renderDays(){
  const T=todayNum(), day=ui.day, p=parts(day), mon=day-p.wd;
  let h=`<header class="top"><div><h1 class="top-title">Tagesansicht</h1><div class="top-sub">${MON[parts(mon).m-1]} ${parts(mon).y}</div></div></header>`;
  h+=`<div class="week" role="group" aria-label="Woche">`;
  for(let i=0;i<7;i++){
    const dn=mon+i, q=parts(dn), m=dayModel(dn, inToday);
    const items=m.due.length+(dn===T?m.overdue.length:0), dd=m.due.filter(o=>o.done).length;
    h+=`<button class="wk${dn===T?" is-today":""}${dn===day?" is-sel":""}" data-a="day" data-v="${dn}" aria-label="${WDL[q.wd]}, ${q.d}. ${MON[q.m-1]}: ${items} Aufgaben"${dn===day?' aria-current="date"':""}>
      <small>${WD[q.wd]}</small><b>${q.d}</b><span class="dots">${Array.from({length:Math.min(items,4)},()=>`<i class="${items&&dd===items?"all":""}"></i>`).join("")}</span></button>`;
  }
  h+=`</div><div class="week-nav"><button class="link-btn" data-a="day" data-v="${day-7}">Vorige Woche</button>${day!==T?`<button class="link-btn" data-a="day" data-v="${T}">Heute</button>`:""}<button class="link-btn" data-a="day" data-v="${day+7}">Nächste Woche</button></div>`;
  h+=`<h2 class="day-title">${day===T?"Heute, ":day===T+1?"Morgen, ":day===T-1?"Gestern, ":""}${WDL[p.wd]}, ${p.d}. ${MON[p.m-1]}</h2>`;
  return h+dayListHtml(day, inToday, {tight:true});
}
function renderFamily(){
  const r=R(), T=todayNum(), mem=Object.entries(S.members).sort((a,b)=>(a[0]===S.uid?-1:b[0]===S.uid?1:a[1].name.localeCompare(b[1].name)));

/* ---------- Wiederholungsregeln ---------- */
function recMatch(r,dn){
  if(!r || dn<r.start) return false;
  if(r.type==="once") return dn===r.start;
  if(r.end!=null && dn>r.end) return false;
  const ev=Math.max(1, (r.every|0)||1), p=parts(dn);
  switch(r.type){
    case "daily": return (dn-r.start)%ev===0;
    case "weekly":{
      if(!r.weekdays.includes(p.wd)) return false;
      const s=parts(r.start); const w=((dn-p.wd)-(r.start-s.wd))/7;
      return w%ev===0;
    }
    case "monthly":{
      const s=parts(r.start); const mo=(p.y-s.y)*12+(p.m-s.m);
      if(mo%ev) return false;
      return r.monthDays.includes(p.d) || (r.monthDays.includes(32) && p.d===lastDayOf(p.y,p.m));
    }
    case "yearly":{
      const s=parts(r.start); if((p.y-s.y)%ev) return false;
      return r.yearDates.some(x=>x.m===p.m && x.d===p.d);
    }
  }
  return false;
}
function recText(r){
  const ev=Math.max(1,(r.every|0)||1); let t="";
  switch(r.type){
    case "once": return "Einmalig am "+fmtLong(r.start);
    case "daily": t= ev===1?"Täglich":`Alle ${ev} Tage`; break;
    case "weekly":{ const ds=r.weekdays.slice().sort().map(i=>WD[i]); t=(ev===1?"Jede Woche":`Alle ${ev} Wochen`)+(ds.length?": "+ds.join(", "):""); break; }
    case "monthly":{ const ds=r.monthDays.slice().sort((a,b)=>a-b).map(d=>d===32?"letzten Tag":d+"."); t=(ev===1?"Monatlich":`Alle ${ev} Monate`)+(ds.length?" am "+joinDe(ds):""); break; }
    case "yearly":{ const ds=r.yearDates.slice().sort((a,b)=>a.m-b.m||a.d-b.d).map(x=>x.d+"."+x.m+"."); t=(ev===1?"Jährlich":`Alle ${ev} Jahre`)+(ds.length?" am "+joinDe(ds):""); break; }
  }
  if(r.end!=null) t+=" bis "+fmtShort(r.end);
  return t;
}
function offsetText(o){ o=o|0; if(o===0) return "am Projekttermin"; return Math.abs(o)+(Math.abs(o)===1?" Tag ":" Tage ")+(o>0?"nach":"vor")+" dem Projekttermin"; }

function project(id){ return D.projects.find(p=>p.id===id); }
function matcherFor(t){
  if(t.projectId){ const p=project(t.projectId); const off=t.offset|0; return p? (dn=>recMatch(p.rec, dn-off)) : (()=>false); }
  return dn=>recMatch(t.rec,dn);
}
function scheduleText(t){
  if(t.projectId){ const p=project(t.projectId); return p? offsetText(t.offset)+" ("+recText(p.rec)+")" : "Projekt fehlt"; }
  return recText(t.rec);
}
function shiftSum(t,orig){ let s=0; for(const x of t.shifts||[]) if(orig>x.after) s+=x.delta; return s; }

/* ---------- Termine einer Aufgabe berechnen ----------
   orig = Termin laut Regel, base = orig + Serienverschiebung, eff = tatsächlicher Tag */
function occurrences(t, from, to){
  const match=matcherFor(t), set=new Set();
  for(let dn=from; dn<=to; dn++) if(dn>=t.created && match(dn)) set.add(dn);
  const pre=t.id+"|";
  for(const k in D.log){ if(k.startsWith(pre)){ const o=+k.slice(pre.length); if(o>=t.created && match(o)) set.add(o); } }
  const list=[...set].sort((a,b)=>a-b).map(orig=>{
    const key=t.id+"|"+orig, L=D.log[key]||{}, base=orig+shiftSum(t,orig);
    return {t, key, orig, base, eff:(L.m!=null?L.m:base), moved:L.m!=null, done:L.d!=null, doneOn:L.d, skip:!!L.s, replaced:null};
  });
  if(t.movable && t.follow==="replace"){
    const rd=Math.max(0,t.replaceDays|0);
    for(let i=0;i<list.length;i++){
      const o=list[i]; if(!o.moved || o.eff<=o.base || o.skip) continue;
      for(let j=i+1;j<list.length;j++){
        const q=list[j];
        if(q.base - o.eff <= rd){ if(!q.done && !q.replaced) q.replaced=o; } else break;
      }
    }
  }
  return list;
}

/* ---------- Was steht an einem Tag an? ---------- */
function dayModel(day, filter){
  const T=todayNum(), due=[], overdue=[], missed=[];
  for(const t of (filter? D.tasks.filter(filter) : D.tasks)){
    const occ=occurrences(t, Math.min(day,T)-75, day+5).filter(o=>!o.replaced && !o.skip && (o.done || !taskPaused(t,o.eff)));
    let hideAfter=null;
    if(day===T && taskActive(t)){
      const pending=occ.filter(o=>!o.done && o.eff<T && o.eff>=T-60);
      if(pending.length){
        if(t.movable){
          if(t.follow==="keep") overdue.push(...pending);
          else if(t.follow==="shift"){ overdue.push(pending[0]); hideAfter=pending[0].orig; }
          else { // replace: nur der jüngste offene Termin zählt, und nur wenn heute nicht schon einer fällig ist
            const last=pending[pending.length-1];
            const newer=occ.some(o=>o.orig>last.orig && o.eff<=T);
            if(!newer) overdue.push(last);
          }
        } else missed.push(...pending.filter(o=>o.eff>=T-3));
      }
    }
    for(const o of occ) if(o.eff===day && !(hideAfter!=null && o.orig>hideAfter && !o.done)) due.push(o);
  }
  return {due, overdue, missed};
}

/* ---------- Zurück-Taste (Android) ----------
   Solange ein Fenster offen ist oder ein anderer Reiter als „Heute“ gezeigt wird,
   liegt ein zusätzlicher Verlaufseintrag oben. „Zurück“ schließt dann zuerst das Fenster,
   danach geht es zu „Heute“. Auf „Heute“ gibt es keinen Eintrag mehr: „Zurück“ schließt die App. */
const NAV={guard:false, skip:0};
function needGuard(){ return sheetOpen || (S.phase==="app" && ui.view!=="today") || (S.phase==="welcome" && !!ui.welcome); }
function syncHistory(){
  if(NAV.skip) return; // ein eigenes history.back() ist noch unterwegs
  const need=needGuard();
  if(need && !NAV.guard){ history.pushState({tagwerk:1},""); NAV.guard=true; }
  else if(!need && NAV.guard){ NAV.guard=false; NAV.skip++; history.back(); }
}
window.addEventListener("popstate",()=>{
  if(NAV.skip){ NAV.skip--; syncHistory(); return; }
  NAV.guard=false;
  if(sheetOpen) closeSheet();
  else if(S.phase==="app" && ui.view!=="today"){ ui.view="today"; ui.reorder=false; ui.day=todayNum(); render(); window.scrollTo(0,0); }
  else if(S.phase==="welcome" && ui.welcome){ ui.welcome=null; render(); }
  syncHistory();
});
function renderSheet(){
  if(!sheet) return;
  const st=$sheet.scrollTop, k=sheet.kind;
  const f={task:taskForm, project:projectForm, occ:occSheet, settings:settingsSheet, menu:menuSheet, member:memberSheet, request:requestSheet, priv:privSheet, pin:pinSheet, viewTask:viewTaskSheet}[k];

  h+=`<label class="field"><span>Gehört zu</span><select class="inp" data-bind="projectId" data-type="str" data-rerender><option value="">keinem Projekt (eigene Termine)</option>${projs.map(p=>`<option value="${p.id}"${d.projectId===p.id?" selected":""}>Projekt: ${esc(p.name)}</option>`).join("")}</select></label>`;
  if(d.projectId){
    const p=project(d.projectId), o=d.offset|0;
    h+=`<div class="box"><span class="lbl">Fällig</span><div class="inline-row" style="margin:0"><input class="inp sm" type="number" min="0" max="365" inputmode="numeric" data-a="offN" data-live value="${Math.abs(o)}"><span>Tage</span>
      <select class="inp inline" data-a="offDir"><option value="1"${o>=0?" selected":""}>nach</option><option value="-1"${o<0?" selected":""}>vor</option></select><span>dem Projekttermin</span></div>
      <p class="note">Projekttermin: ${p?dot(recText(p.rec)):""} 0 Tage heißt: am selben Tag.</p></div>`;
  } else h+=recEditor(d.rec);

  h+=`<div class="box"><div class="switch-row"><div><b>Verschiebbar</b><small>Ein Termin kann auf einen anderen Tag gelegt werden. Nicht erledigte Termine wandern auf heute.</small></div>
     <label class="switch"><input type="checkbox" data-bind="movable" data-type="bool" data-rerender ${d.movable?"checked":""} aria-label="Verschiebbar"><i></i></label></div>`;
  if(d.movable){
    h+=`<div style="margin-top:14px"><span class="lbl">Wenn ein Termin später erledigt wird, passiert mit dem nächsten Termin:</span>
      <label class="radio"><input type="radio" name="follow" value="replace" data-bind="follow" data-type="str" data-rerender ${d.follow==="replace"?"checked":""}><div><b>Er entfällt, wenn der verschobene zu nah dran liegt</b>
        <small>Liegt der verschobene Termin <input class="inp sm" type="number" min="0" max="365" inputmode="numeric" data-bind="replaceDays" data-type="num" data-live value="${d.replaceDays|0}" aria-label="Tage" style="width:4em;padding:4px"> Tage oder weniger vor dem nächsten, ersetzt er ihn.</small></div></label>
      <label class="radio"><input type="radio" name="follow" value="keep" data-bind="follow" data-type="str" data-rerender ${d.follow==="keep"?"checked":""}><div><b>Er bleibt immer bestehen</b><small>Jeder Termin muss einzeln erledigt werden, verpasste sammeln sich an.</small></div></label>
      <label class="radio"><input type="radio" name="follow" value="shift" data-bind="follow" data-type="str" data-rerender ${d.follow==="shift"?"checked":""}><div><b>Die ganze Serie rückt mit</b><small>Alle folgenden Termine verschieben sich um gleich viele Tage.</small></div></label>
      <div class="preview" id="preview">${followPreview(d)}</div></div>`;
  }
  h+=`</div>`+activeBox(d,"t")+`<p class="note err" id="form-err"></p>`;
  h+=`<div class="sheet-actions">${isNew?"":`<button class="btn danger" data-a="delTask">Löschen</button>`}<span class="grow"></span><button class="btn primary" data-a="saveTask">${isNew?"Aufgabe anlegen":"Änderungen speichern"}</button></div>`;
  return h;
}
function followPreview(d){ return followPreviewRaw(d).replace(/\.\./g,"."); }
function followPreviewRaw(d){
  const T=todayNum();
  let match;
  if(d.projectId){ const p=project(d.projectId); if(!p) return ""; const off=d.offset|0; match=dn=>recMatch(p.rec,dn-off); }
  else { if(recValid(d.rec)) return ""; match=dn=>recMatch(d.rec,dn); }
  const n=nextN(match,T,2);
  if(n.length<2) return n.length?`Diese Aufgabe hat nur einen Termin (${fmtShort(n[0])}), daher gibt es keinen Folgetermin.`:"";
  const [a,b]=n;
  if(d.follow==="keep") return `Beispiel: Erledigst du den Termin vom ${fmtShort(a)} erst nach dem ${fmtShort(b)}, stehen beide auf deiner Liste.`;
  if(d.follow==="shift"){ const s=Math.min(2,b-a); return `Beispiel: Verschiebst du ${fmtShort(a)} um ${s} ${s===1?"Tag":"Tage"}, liegt der nächste Termin auf ${fmtShort(b+s)} statt ${fmtShort(b)}.`; }
  const rd=Math.max(0,d.replaceDays|0), thr=b-rd;
  if(thr<=a+1) return `Beispiel: Schon wenn du ${fmtShort(a)} um einen Tag verschiebst, entfällt der Termin am ${fmtShort(b)}.`;
  return `Beispiel: Verschiebst du ${fmtShort(a)} auf ${fmtShort(thr)} oder später, entfällt der Termin am ${fmtShort(b)}. Bis ${fmtShort(thr-1)} bleibt er bestehen.`;
}

function saveTask(){
  const d=sheet.draft, err=$sheet.querySelector("#form-err");
  d.title=d.title.trim();
  if(!d.title){ err.textContent="Gib der Aufgabe einen Namen."; return; }
  if(!d.projectId){ const e=recValid(d.rec); if(e){ err.textContent=e; return; } }
  if(d.scope==="fam" && !R().edit){ err.textContent="Du darfst keine Familien-Aufgaben anlegen oder ändern."; return; }
  const T=todayNum(), assignee = d.scope==="fam" ? (d.assignee||null) : undefined;
  change(()=>{
    if(d.id){
      const t=D.tasks.find(x=>x.id===d.id);
      const ruleChanged = JSON.stringify([t.rec,t.projectId,t.offset])!==JSON.stringify([d.rec,d.projectId,d.offset]);
      if(t.projectId!==d.projectId) t.order=nextOrder({projectId:d.projectId, scope:t.scope});
      Object.assign(t,{prio:d.prio, title:d.title, projectId:d.projectId, offset:d.offset|0, rec:d.projectId?null:d.rec, movable:d.movable, follow:d.follow, replaceDays:Math.max(0,d.replaceDays|0)});
      if(t.scope==="fam" && R().assign) t.assignee=assignee;
      if(ruleChanged || d.follow!=="shift") t.shifts=[];
      if(!!t.inactive===!!d.active) setActive(t, !!d.active);
    } else {
      const t={id:uid(), scope:d.scope, prio:d.prio, order:nextOrder({projectId:d.projectId, scope:d.scope}), title:d.title, projectId:d.projectId, offset:d.offset|0, rec:d.projectId?null:d.rec, movable:d.movable, follow:d.follow, replaceDays:Math.max(0,d.replaceDays|0), shifts:[], created:(!d.projectId && d.rec.type==="once")? Math.min(T,d.rec.start) : T};
      if(d.scope==="fam"){ t.assignee=R().assign? assignee : null; t.createdBy=S.uid; }
      if(!d.active) setActive(t,false);
      D.tasks.push(t);
    }
  });
  closeSheet(); render(); toast(d.id?"Gespeichert.":"Aufgabe angelegt.");
}

/* ---------- Termin ---------- */
function occSheet(){
  const o=findOcc(sheet.key); if(!o){ return head("Termin")+`<p>Dieser Termin existiert nicht mehr.</p>`; }
  const T=todayNum(), t=o.t, act=canAct(t);
  let h=head(esc(t.title));
  const who = t.scope==="fam" ? ` Familie, zuständig: ${t.assignee?esc(nameOfNom(t.assignee)):"alle"}.` : "";
  h+=`<p class="note" style="margin:-4px 0 18px">${o.eff<T&&!o.done?"Fällig seit ":"Termin: "}${fmtLong(o.eff)}${o.moved&&o.eff!==o.orig?", ursprünglich "+dot(fmtShort(o.orig)):"."} ${esc(dot(scheduleText(t)))}${who}</p>`;
  if(act){
    h+=`<div class="menu"><button class="btn${o.done?"":" primary"}" data-a="toggle" data-k="${o.key}" data-close="1">${o.done?"Wieder als offen markieren":"Abhaken"}</button></div>`;
    if(t.movable && !o.done){
      const base=Math.max(T,o.eff);
      const opts=[[base+1,"+1 Tag"],[base+2,"+2 Tage"],[base+7,"+1 Woche"]];
      if(o.eff<T){ opts.unshift([T,"Heute"]); opts.pop(); }
      h+=`<div class="field" style="margin-top:20px"><span>Verschieben auf</span><div class="quick">${opts.map(([dn,l])=>`<button class="btn" data-a="move" data-k="${o.key}" data-v="${dn}">${l}<small>${fmtShort(dn)}</small></button>`).join("")}</div>
        <div class="inline-row" style="margin:0"><input class="inp" type="date" id="move-date" min="${iso(T)}" value="${iso(base+1)}" style="flex:1" aria-label="Anderes Datum"><button class="btn" data-a="moveDate" data-k="${o.key}">Verschieben</button></div>
        <p class="note">${t.follow==="replace"?`Liegt das neue Datum ${t.replaceDays|0} Tage oder weniger vor dem nächsten Termin, entfällt dieser.`:t.follow==="shift"?"Alle folgenden Termine rücken um gleich viele Tage mit.":"Folgetermine bleiben unverändert."}</p></div>`;
    } else if(!t.movable && !o.done) h+=`<p class="note" style="margin-top:16px">Diese Aufgabe ist fest terminiert und kann nicht verschoben werden.</p>`;
  } else h+=`<div class="box notice">${esc(denyMsg(t))}</div>`;
  if(t.scope==="fam" && R().assign && !o.done) h+=`<div style="margin-top:20px">${assignHtml(t)}</div>`;
  h+=`<div class="menu" style="margin-top:20px">${act&&!o.done?`<button class="btn" data-a="skip" data-k="${o.key}">Diesen Termin auslassen</button>`:""}${canEditItem(t)?`<button class="btn" data-a="editTask" data-v="${t.id}">Aufgabe bearbeiten</button>`:""}</div>`;
  return h;
}
