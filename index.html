function setPath(o,path,v){ const ks=path.split("."); let x=o; for(let i=0;i<ks.length-1;i++) x=x[ks[i]]; x[ks[ks.length-1]]=v; }
function readVal(el){
  const t=el.dataset.type;
  if(t==="bool") return el.checked;
  if(t==="num") return Math.max(0, parseInt(el.value,10)||0);
  if(t==="date") return fromIso(el.value);
  if(el.type==="radio") return el.value;
  return el.value===""&&el.tagName==="SELECT" ? null : el.value;
}
async function setMemberActive(uid, on){
  const m=S.members[uid]; if(!m) return;
  try{ await B.updateMember(uid,{active:on}); render(); renderSheet(); toast((uid===S.uid?"Du bist":m.name+" ist")+" jetzt "+(on?"aktiv":"inaktiv")+" bei Familien-Aufgaben."); }
  catch(err){ console.warn(err); renderSheet(); toast("Das wurde nicht gespeichert: fehlende Berechtigung oder keine Verbindung."); }
}
function updatePreview(){ const p=$sheet.querySelector("#preview"); if(p && sheet && sheet.kind==="task") p.innerHTML=followPreview(sheet.draft); }
const val=id=>{ const e=document.getElementById(id); return e? e.value.trim() : ""; };
const setErr=(id,msg)=>{ const e=document.getElementById(id); if(e) e.textContent=msg; };
function busy(b,on){ if(b){ b.disabled=on; } }

$sheet.addEventListener("input",e=>{
  const el=e.target; if(!sheet||!sheet.draft) return;
  if(el.dataset.bind && el.dataset.type!=="bool" && el.type!=="radio" && el.tagName!=="SELECT"){
    let v=readVal(el);
    if(el.dataset.bind==="rec.start" && v==null) return;
    if(el.dataset.bind==="rec.every") v=Math.max(1,v);
    setPath(sheet.draft, el.dataset.bind, v); updatePreview();
  }
  if(el.dataset.a==="offN"){ const dir=Math.sign(sheet.draft.offset|0)||1; sheet.draft.offset=(Math.min(365,parseInt(el.value,10)||0))*(dir<0?-1:1); updatePreview(); }
});
$sheet.addEventListener("change",e=>{
  const el=e.target; if(!sheet) return;
  if((el.dataset.a==="mright"||el.dataset.a==="qright") && sheet.rights){ sheet.rights[el.dataset.v]=el.checked; if(el.dataset.v==="admin"&&el.checked) Object.assign(sheet.rights,{check:true,edit:true,assign:true}); renderSheet(); return; }
  if(el.dataset.a==="mactive"){ setMemberActive(sheet.uid, el.checked); return; }
  if(!sheet.draft) return;
  if(el.dataset.bind){
    let v=readVal(el);
    if(el.dataset.bind==="rec.start" && v==null) return;
    if(el.dataset.bind==="rec.every") v=Math.max(1,v);
    setPath(sheet.draft, el.dataset.bind, v);
    if(el.dataset.rerender!==undefined || el.dataset.live!==undefined || el.type==="date") renderSheet(); else updatePreview();
  }
  if(el.dataset.a==="offDir"){ sheet.draft.offset=Math.abs(sheet.draft.offset|0)*(+el.value); updatePreview(); }
  if(el.dataset.a==="yd"){ sheet.draft.rec.yearDates[+el.dataset.i][el.dataset.f]=+el.value; const x=sheet.draft.rec.yearDates[+el.dataset.i]; x.d=Math.min(x.d, x.m===2?29:lastDayOf(2001,x.m)); renderSheet(); }
});
$sheet.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.tagName==="INPUT" && e.target.type!=="checkbox" && e.target.type!=="radio"){ e.preventDefault(); e.target.blur(); } });

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  if(b.tagName==="SELECT"||(b.tagName==="INPUT"&&b.type!=="button")) return;
  const a=b.dataset.a, v=b.dataset.v, d=sheet&&sheet.draft;
  try{
  switch(a){
    case "reload": location.reload(); break;
    case "menu": openSheet({kind:"menu"}); break;
    case "go": ui.view=v; ui.reorder=false; if(v!=="lib") ui.day=todayNum(); closeSheet(); render(); window.scrollTo(0,0); break;
    case "day": ui.day=+v; render(); break;
    case "toggle":{ const o=findOcc(b.dataset.k); if(o){ toggleDone(o); if(b.dataset.close && canAct(o.t)) closeSheet(); } break; }
    case "occ": openSheet({kind:"occ", key:b.dataset.k}); break;
    case "move": doMove(b.dataset.k, +v); break;
    case "moveDate": doMove(b.dataset.k, fromIso($sheet.querySelector("#move-date").value)); break;
    case "skip": doSkip(b.dataset.k); break;
    case "assign": doAssign(b.dataset.k, v); break;
    case "newTask":{ const sc=b.dataset.scope || (ui.view==="family"?"fam":"me"); openSheet({kind:"task", draft:newTaskDraft(v||null, sc)}); break; }
    case "viewTask": openSheet({kind:"viewTask", id:v}); break;
    case "editTask":{ const t=D.tasks.find(x=>x.id===v); if(!t) break; if(!canEditItem(t)){ openSheet({kind:"viewTask", id:v}); break; }
      openSheet({kind:"task", draft:Object.assign(newTaskDraft(), clone(t), {rec: clone(t.rec||newRec("weekly",todayNum())), assignee:t.assignee??null, active:!t.inactive})}); break; }
    case "newProject":{ let sc=b.dataset.scope || (ui.view==="family"?"fam":"me"); if(sc==="fam"&&!R().edit) sc="me"; openSheet({kind:"project", draft:{id:null, scope:sc, name:"", prio:2, color:COLORS[D.projects.length%COLORS.length], rec:newRec("once",todayNum()+7), active:true}}); break; }
    case "editProject":{ const p=project(v); if(p && canEditItem(p)) openSheet({kind:"project", draft:Object.assign(clone(p),{active:!p.inactive})}); break; }
    case "saveTask": saveTask(); break;
    case "saveProject": saveProject(); break;
    case "scope": d.scope=v; d.projectId=null; d.assignee=null; renderSheet(); break;
    case "delTask":
      if(confirm("Aufgabe „"+d.title+"“ löschen?")){ change(()=>{ D.tasks=D.tasks.filter(t=>t.id!==d.id); for(const k of Object.keys(D.log)) if(k.startsWith(d.id+"|")) delete D.log[k]; }); closeSheet(); render(); toast("Aufgabe gelöscht.",true); }
      break;
    case "delProject":{
      const ids=D.tasks.filter(t=>t.projectId===d.id).map(t=>t.id), n=ids.length;
      if(confirm("Projekt „"+d.name+"“"+(n?" mit "+n+" Aufgabe"+(n>1?"n":""):"")+" löschen?")){
        change(()=>{ D.projects=D.projects.filter(p=>p.id!==d.id); D.tasks=D.tasks.filter(t=>t.projectId!==d.id); for(const k of Object.keys(D.log)) if(ids.includes(k.split("|")[0])) delete D.log[k]; });
        closeSheet(); render(); toast("Projekt gelöscht.",true); }
      break; }
    case "close": closeSheet(); break;
    case "color": d.color=v; renderSheet(); break;
    case "prio": d.prio=+v; renderSheet(); break;
    case "rectype":{
      const old=d.rec, r=newRec(v, old.start); r.every=old.every||1; r.end=v==="once"?null:old.end;
      if(old.weekdays.length) r.weekdays=old.weekdays; if(old.monthDays.length) r.monthDays=old.monthDays; if(old.yearDates.length) r.yearDates=old.yearDates;
      d.rec=r; renderSheet(); break; }
    case "wd":{ const i=+v, s=d.rec.weekdays; d.rec.weekdays = s.includes(i)? s.filter(x=>x!==i) : [...s,i]; renderSheet(); break; }
    case "md":{ const i=+v, s=d.rec.monthDays; d.rec.monthDays = s.includes(i)? s.filter(x=>x!==i) : [...s,i]; renderSheet(); break; }
    case "addyd": d.rec.yearDates.push({m:1,d:1}); renderSheet(); break;
    case "rmyd": d.rec.yearDates.splice(+v,1); renderSheet(); break;
    case "reorderToggle": ui.reorder=!ui.reorder; render(); break;
    case "up": case "down":{ const x=(b.dataset.kind==="p"?D.projects:D.tasks).find(y=>y.id===v); if(x) reorder(x, a==="up"?-1:1); break; }
    case "settings": openSheet({kind:"settings"}); break;
    case "theme": try{ localStorage.setItem("tagwerk.theme",v); }catch(err){} applyTheme(); renderSheet(); break;

    /* --- Einstieg --- */
    case "welcome": ui.welcome=v||null; render(); setTimeout(()=>$app.querySelector("input")?.focus(),30); break;
    case "createFamily":{
      const fam=val("w-fam"), name=val("w-name"), pin=document.getElementById("w-pin").value;
      if(!fam||!name){ setErr("w-err","Bitte Familienname und deinen Namen eingeben."); break; }
      if(pin.length<4){ setErr("w-err","Das Admin-Passwort braucht mindestens 4 Zeichen."); break; }
      const imp=document.getElementById("w-import"), data=imp&&imp.checked? oldLocalData() : null;
      busy(b,true); await B.createFamily(fam,name,pin,data); ui.welcome=null; ui.view="today"; render(); toast("Familie gegründet. Lade die anderen unter „Familie“ ein."); break; }
    case "requestJoin":{
      const code=val("w-code"), name=val("w-name");
      if(!code||!name){ setErr("w-err","Bitte Code und deinen Namen eingeben."); break; }
      busy(b,true);
      try{ await B.requestJoin(code,name); ui.welcome=null; render(); }
      catch(err){ busy(b,false); setErr("w-err", err.message==="code"?"Diesen Code gibt es nicht. Prüfe die Schreibweise.":"Die Anfrage konnte nicht gesendet werden. Prüfe die Internetverbindung."); }
      break; }
    case "cancelRequest": await B.cancelRequest(); render(); break;
    case "signIn":{
      busy(b,true);
      try{ await B.signIn(val("w-mail"), document.getElementById("w-pw").value); }
      catch(err){ busy(b,false); setErr("w-err","Anmeldung fehlgeschlagen. Prüfe E-Mail und Passwort."); }
      break; }

    /* --- Familie --- */
    case "member": openSheet({kind:"member", uid:v}); break;
    case "request": openSheet({kind:"request", uid:v}); break;
    case "renameSelf":{ const n=val("m-name"); if(n){ await B.updateMember(S.uid,{name:n}); closeSheet(); render(); toast("Name geändert."); } break; }
    case "saveRights":{
      const uid=sheet.uid, rr=sheet.rights;
      const admins=Object.entries(S.members).filter(([u,m])=>u!==uid&&rightsOf(m).admin).length;
      if(!rr.admin && rightsOf(S.members[uid]).admin && admins===0){ setErr("form-err","Es muss mindestens einen Admin geben."); break; }
      await B.updateMember(uid,{rights:{admin:!!rr.admin, check:!!(rr.check||rr.admin), edit:!!(rr.edit||rr.admin), assign:!!(rr.assign||rr.admin)}});
      closeSheet(); render(); toast("Rechte gespeichert."); break; }
    case "removeMember":{ const m=S.members[sheet.uid]; if(m && confirm(m.name+" aus der Familie entfernen? Zugewiesene Aufgaben werden wieder für alle freigegeben.")){ await B.removeMember(sheet.uid); closeSheet(); render(); toast(m.name+" wurde entfernt."); } break; }
    case "approveReq":{ const n=val("q-name"), rr=sheet.rights; if(!n){ break; } busy(b,true);
      await B.approve(sheet.uid, n, {admin:!!rr.admin, check:!!(rr.check||rr.admin), edit:!!(rr.edit||rr.admin), assign:!!(rr.assign||rr.admin)}); closeSheet(); render(); toast(n+" ist jetzt in der Familie."); break; }
    case "rejectReq": if(confirm("Anfrage ablehnen?")){ await B.reject(sheet.uid); closeSheet(); render(); toast("Anfrage abgelehnt."); } break;
    case "changePin": openSheet({kind:"pin"}); break;
    case "savePin":{ const p1=document.getElementById("p1").value, p2=document.getElementById("p2").value;
      if(p1.length<4){ setErr("form-err","Mindestens 4 Zeichen."); break; } if(p1!==p2){ setErr("form-err","Die beiden Eingaben stimmen nicht überein."); break; }
      await B.setPin(p1); closeSheet(); toast("Admin-Passwort geändert."); break; }
    case "privOpen": openSheet({kind:"priv", uid:v}); break;
    case "privUnlock":{ busy(b,true);
      try{ sheet.data=await B.readPrivate(sheet.uid, document.getElementById("pin").value); renderSheet(); }
      catch(err){ busy(b,false); setErr("form-err", err.message==="pin"?"Das Admin-Passwort stimmt nicht.":"Konnte nicht geladen werden."); }
      break; }
    case "copyInvite":{
      const code=(S.family&&S.family.code)||"", link=location.protocol.startsWith("http")&&!location.hostname.endsWith("claude.ai")?location.origin+location.pathname:"";
      const txt=`Mach mit bei „${(S.family&&S.family.name)||"unserer Familie"}“ in Tagwerk!${link?"\nApp: "+link:""}\nFamilien-Code: ${code}\nÖffne die App, tippe auf „Einer Familie beitreten“ und gib den Code ein.`;
      try{ await navigator.clipboard.writeText(txt); toast("Einladung kopiert."); }catch(err){ prompt("Einladung kopieren:",txt); }
      break; }
    case "renameFamily":{ const n=val("s-fam"); if(n){ await B.renameFamily(n); render(); toast("Gespeichert."); } break; }
    case "secure":{
      const mail=val("s-mail"), pw=document.getElementById("s-pw").value, msg=document.getElementById("set-msg");
      if(!mail||pw.length<6){ msg.textContent="Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben."; break; }
      try{ await B.secure(mail,pw); renderSheet(); toast("Anmeldung gesichert."); }
      catch(err){ msg.textContent = err.code==="auth/email-already-in-use"?"Diese E-Mail wird schon verwendet.":err.code==="auth/operation-not-allowed"?"E-Mail-Anmeldung ist in Firebase noch nicht eingeschaltet (siehe Anleitung).":"Hat nicht geklappt: "+(err.code||err.message); }
      break; }

    /* --- Demo --- */
    case "demoSwitch": B.switchTo(v); closeSheet(); ui.view="today"; render(); toast("Du siehst die App jetzt als "+(S.members[S.uid]?S.members[S.uid].name:"wartende Person")+"."); break;
    case "demoRequest": B.simulateRequest(); render(); toast("Neue Beitrittsanfrage eingegangen."); break;
    case "demoNewDevice": B.newDevice(); closeSheet(); ui.welcome=null; render(); break;
    case "demoReset": if(confirm("Demo komplett zurücksetzen?")) B.reset(); break;

    /* --- Sicherung --- */
    case "export":{
      const txt=JSON.stringify(subset("me")), msg=$sheet.querySelector("#set-msg");
      (navigator.clipboard? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>{ msg.textContent="Sicherung kopiert. Füge sie z. B. in eine Notiz ein."; })
        .catch(()=>{ const ta=$sheet.querySelector("#imp"); ta.value=txt; ta.select(); msg.textContent="Kopieren war nicht möglich. Die Sicherung steht jetzt im Feld darüber, markiert zum Kopieren."; });
      break; }
    case "import":{
      const msg=$sheet.querySelector("#set-msg");
      let x; try{ x=JSON.parse($sheet.querySelector("#imp").value); }catch(err){}
      if(!x || !Array.isArray(x.tasks) || !Array.isArray(x.projects)){ msg.textContent="Das ist keine gültige Tagwerk-Sicherung. Kopiere den kompletten Text des Exports."; break; }
      if(!confirm("Alle persönlichen Aufgaben durch die Sicherung ersetzen?")) break;
      change(()=>{ const fam=subset("fam"); rebuild({tasks:x.tasks.map(t=>({...t,scope:"me"})), projects:x.projects.map(p=>({...p,scope:"me"})), log:x.log||{}}, fam); });
      closeSheet(); render(); toast("Sicherung eingespielt.",true); break; }
  }
  }catch(err){ console.error(err); busy(b,false); toast("Das hat nicht geklappt"+(err&&err.code?" ("+err.code+")":"")+"."); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && sheetOpen) closeSheet(); });
$scrim.addEventListener("click",e=>{ if(e.target===$scrim) closeSheet(); });

/* ---------- Toast ---------- */
let toastTimer=null;
const $toast=document.getElementById("toast"), $undo=document.getElementById("toast-undo");
function toast(msg,canUndo){ document.getElementById("toast-text").textContent=msg; $undo.hidden=!canUndo||!undoBefore; $toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,5200); }
function hideToast(){ $toast.classList.remove("show"); }
$undo.addEventListener("click",undo);

/* ---------- Tageswechsel ---------- */
let lastDay=todayNum();
function checkDay(){ const T=todayNum(); if(T!==lastDay){ if(ui.day===lastDay) ui.day=T; lastDay=T; render(); } }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkDay(); });
setInterval(checkDay,60000);

/* ---------- Start ---------- */
async function boot(){
  applyTheme(); render();
  const cfg=window.TAGWERK_FIREBASE;
  try{
    B = (cfg && cfg.apiKey && !/DEIN|YOUR/.test(cfg.apiKey)) ? await firebaseBackend(cfg) : demoBackend();
    S.mode=B.kind;
    await B.start();
  }catch(err){
    console.error(err); S.phase="error";
    S.error = (err&&err.code==="auth/operation-not-allowed") ? "Die anonyme Anmeldung ist in Firebase noch nicht eingeschaltet. Siehe Schritt 3 der Anleitung." :
              (err&&err.code==="auth/admin-restricted-operation") ? "Die anonyme Anmeldung ist in Firebase noch nicht eingeschaltet. Siehe Schritt 3 der Anleitung." :
              "Prüfe die Internetverbindung und die Firebase-Einstellungen in config.js. ("+((err&&(err.code||err.message))||err)+")";
  }
  render();
}
if(!window.claude && "serviceWorker" in navigator && location.protocol==="https:"){
  const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.webmanifest"; document.head.appendChild(l);
  const ai=document.createElement("link"); ai.rel="apple-touch-icon"; ai.href="icon-192.png"; document.head.appendChild(ai);
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
boot();

</script>
